[project]
name = "financial-analyst-agent"
version = "0.1.0"
description = "Quantitative financial analysis via ReAct agent — LangGraph + Groq/Gemini + LangSmith"
requires-python = ">=3.11"

dependencies = [
    # LLM / Agent
    "langchain-core>=0.3",
    "langchain-groq>=0.3",
    "langchain-google-genai>=2.0",
    "langgraph>=0.3",
    "langsmith>=0.2",
    # Market data + quant
    "yfinance>=0.2",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.13",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    # Database
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    # Colab / dev utils
    "nest-asyncio>=1.6",
    "python-dotenv>=1.0",
    "ngrok>=1.4.0",
    "pyngrok>=8.1.2",
    "langchain-openai>=1.3.2",
]

[project.optional-dependencies]
tunnel = [
    "pyngrok>=7.0",
]
dev = [
    "ipykernel>=6.0",
    "jupyter>=1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.0",
    "jupyter>=1.0",
]
